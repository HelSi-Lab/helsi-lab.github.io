---
layout: default
---

<article class="lab-post-page">
  <header class="lab-post-heading">
    <p>NEWS · 소식</p>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
  </header>
  {% if page.images and page.images.size > 0 %}
    <div class="lab-post-gallery">
      {% for image in page.images %}<img src="{{ image | relative_url }}" alt="{{ page.title }}" loading="lazy">{% endfor %}
    </div>
  {% endif %}
  <div class="lab-post-content">
    {{ content }}
  </div>
  <p class="lab-post-back"><a href="{{ '/news/' | relative_url }}">← Back to News · 소식 목록</a></p>
</article>
