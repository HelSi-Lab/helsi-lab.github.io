---
layout: default
---

<article class="lab-post-page">
  <header class="lab-post-heading">
    <p>NEWS · 소식</p>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
  </header>
  <div class="lab-post-content">
    {{ content }}
  </div>
  <p class="lab-post-back"><a href="{{ '/news/' | relative_url }}">← Back to News · 소식 목록</a></p>
</article>
